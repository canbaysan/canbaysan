<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320">
  <defs>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#18CA1F"/>
      <stop offset="0.33" stop-color="#F0FF32"/>
      <stop offset="0.66" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#18CA1F"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="0 40" dur="3s" repeatCount="indefinite"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect width="1000" height="320" rx="24"/></clipPath>
    <clipPath id="typing">
      <rect x="500" y="185" width="0" height="40">
        <animate attributeName="x" from="500" to="140" begin="1s" dur="2.2s" fill="freeze"/>
        <animate attributeName="width" from="0" to="720" begin="1s" dur="2.2s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    .blob { transform-box: fill-box; transform-origin: center; }
    .b1 { animation: m1 9s ease-in-out infinite alternate; }
    .b2 { animation: m2 11s ease-in-out infinite alternate; }
    .b3 { animation: m3 13s ease-in-out infinite alternate; }
    @keyframes m1 { to { transform: translate(260px, 60px) scale(1.3); } }
    @keyframes m2 { to { transform: translate(-280px, -40px) scale(0.8); } }
    @keyframes m3 { to { transform: translate(120px, -80px) scale(1.2); } }
    .name { opacity: 0; animation: in 1.2s ease-out forwards; }
    @keyframes in { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
    .tag { opacity: 0; animation: fade 1s ease 3.4s forwards; }
    @keyframes fade { to { opacity: 1; } }
    .p { animation: rise linear infinite; opacity: 0; }
    @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .9; } 100% { transform: translateY(-340px); opacity: 0; } }
    .ring { transform-box: fill-box; transform-origin: center; animation: spin 20s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1000" height="320" fill="#0d1117"/>
    <circle class="blob b1" cx="200" cy="80" r="140" fill="#18CA1F" opacity="0.35" filter="url(#blur)"/>
    <circle class="blob b2" cx="820" cy="240" r="160" fill="#a855f7" opacity="0.4" filter="url(#blur)"/>
    <circle class="blob b3" cx="520" cy="300" r="120" fill="#302b63" opacity="0.6" filter="url(#blur)"/>
    <rect width="1000" height="320" fill="url(#grid)"/>

    <!-- particles -->
    <g fill="#F0FF32">
      <circle class="p" cx="80"  cy="330" r="2"   style="animation-duration:7s;animation-delay:0s"/>
      <circle class="p" cx="170" cy="330" r="1.5" style="animation-duration:9s;animation-delay:2s"/>
      <circle class="p" cx="290" cy="330" r="2.5" style="animation-duration:8s;animation-delay:4s"/>
      <circle class="p" cx="420" cy="330" r="1.5" style="animation-duration:10s;animation-delay:1s"/>
      <circle class="p" cx="610" cy="330" r="2"   style="animation-duration:7.5s;animation-delay:3s"/>
      <circle class="p" cx="720" cy="330" r="1.5" style="animation-duration:9.5s;animation-delay:5s"/>
      <circle class="p" cx="860" cy="330" r="2.5" style="animation-duration:8.5s;animation-delay:.5s"/>
      <circle class="p" cx="940" cy="330" r="2"   style="animation-duration:11s;animation-delay:2.5s"/>
    </g>
    <g fill="#18CA1F">
      <circle class="p" cx="130" cy="330" r="2"   style="animation-duration:10s;animation-delay:3.5s"/>
      <circle class="p" cx="360" cy="330" r="1.5" style="animation-duration:8s;animation-delay:6s"/>
      <circle class="p" cx="540" cy="330" r="2"   style="animation-duration:9s;animation-delay:1.5s"/>
      <circle class="p" cx="680" cy="330" r="2.5" style="animation-duration:12s;animation-delay:4.5s"/>
      <circle class="p" cx="900" cy="330" r="1.5" style="animation-duration:7s;animation-delay:6.5s"/>
    </g>

    <!-- rotating rings -->
    <circle class="ring" cx="90" cy="250" r="44" fill="none" stroke="#18CA1F" stroke-opacity=".35" stroke-width="2" stroke-dasharray="6 10"/>
    <circle class="ring" cx="915" cy="70" r="34" fill="none" stroke="#a855f7" stroke-opacity=".45" stroke-width="2" stroke-dasharray="4 8"/>

    <!-- name -->
    <text class="name" x="500" y="150" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="2" fill="url(#name)" filter="url(#glow)">can baysan</text>

    <!-- typed subtitle -->
    <g clip-path="url(#typing)">
      <text x="500" y="213" text-anchor="middle" font-family="'Fira Code', Consolas, 'Courier New', monospace" font-size="24" fill="#e6edf3">web developer · AI power user · automation</text>
    </g>

    <text class="tag" x="500" y="268" text-anchor="middle" font-family="'Fira Code', Consolas, 'Courier New', monospace" font-size="16" fill="#8b949e" letter-spacing="3">&gt; BUILDING THE WEB WITH AI ⚡</text>
  </g>
  <rect x="1" y="1" width="998" height="318" rx="23" fill="none" stroke="#30363d" stroke-width="2"/>
</svg>
